<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkour Multiplayer</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e0e0e0;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #fff;
            border: 3px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .status { margin-top: 10px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <canvas id="jogoCanvas" width="600" height="200"></canvas>
    <div class="status" id="statusTexto">Conectando ao servidor...</div>

    <script type="module">
        // 1. IMPORTAÇÕES
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // 2. SUAS CHAVES DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyB5e1np_A_YmEruPJ8tvXbitNA07X42CeM",
            authDomain: "parkour-871d9.firebaseapp.com",
            databaseURL: "https://parkour-871d9-default-rtdb.firebaseio.com",
            projectId: "parkour-871d9",
            storageBucket: "parkour-871d9.firebasestorage.app",
            messagingSenderId: "556878698255",
            appId: "1:556878698255:web:1fd4d9d2013bd15d1c107a",
            measurementId: "G-RT17LJYHYF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 3. CONFIGURAÇÃO DO JOGADOR
        const meuId = "jogador_" + Math.random().toString(36).substr(2, 9);
        const jogadorRef = ref(db, 'jogadores/' + meuId);
        onDisconnect(jogadorRef).remove(); // Apaga do servidor ao fechar a aba

        const canvas = document.getElementById("jogoCanvas");
        const ctx = canvas.getContext("2d");

        let meuJogador = {
            id: meuId,
            y: 150,
            cor: "#" + Math.floor(Math.random()*16777215).toString(16),
            velocidadeY: 0,
            noChao: true
        };

        let todosJogadores = {};
        
        // NOVAS VARIÁVEIS PARA O JOGO
        let obstaculos = [];
        let frame = 0;
        let pontuacao = 0;
        let jogoRodando = true;

        document.getElementById("statusTexto").innerText = "Conectado! Pressione ESPAÇO para pular.";

        // Escuta os outros jogadores
        const jogadoresRef = ref(db, 'jogadores');
        onValue(jogadoresRef, (snapshot) => {
            const dados = snapshot.val();
            todosJogadores = dados ? dados : {};
        });

        // Controles de Pulo e Reinício
        function pular() {
            if (meuJogador.noChao && jogoRodando) {
                meuJogador.velocidadeY = -10;
                meuJogador.noChao = false;
            } else if (!jogoRodando) {
                // Se bateu, o pulo reinicia o jogo
                obstaculos = [];
                pontuacao = 0;
                frame = 0;
                meuJogador.y = 150;
                meuJogador.velocidadeY = 0;
                jogoRodando = true;
            }
        }
        document.addEventListener("keydown", (e) => { if (e.code === "Space") pular(); });
        canvas.addEventListener("mousedown", pular);

        // Envia sua posição para o Firebase constantemente
        setInterval(() => {
            set(jogadorRef, { y: meuJogador.y, cor: meuJogador.cor });
        }, 30);

        // 4. MOTOR DO JOGO
        function loopMotor() {
            requestAnimationFrame(loopMotor);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tela de Game Over
            if (!jogoRodando) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "24px Arial";
                ctx.fillText("Bateu!", 260, 90);
                ctx.font = "16px Arial";
                ctx.fillText("Pressione Espaço para tentar de novo", 170, 130);
                return; // Pausa a animação dos blocos
            }

            // Física do seu boneco
            meuJogador.velocidadeY += 0.6; // Gravidade
            meuJogador.y += meuJogador.velocidadeY;

            if (meuJogador.y >= 150) {
                meuJogador.y = 150;
                meuJogador.velocidadeY = 0;
                meuJogador.noChao = true;
            }

            // ==========================================
            // SISTEMA DE OBSTÁCULOS E PONTOS
            // ==========================================
            frame++;
            pontuacao++;

            // Cria um obstáculo novo de tempos em tempos
            if (frame % 90 === 0) {
                obstaculos.push({
                    x: canvas.width,
                    y: 130, // Fica rente ao chão
                    largura: 20,
                    altura: 40
                });
            }

            // Desenha e move os obstáculos vermelhos
            ctx.fillStyle = "#DC3545"; 
            for (let i = 0; i < obstaculos.length; i++) {
                let obs = obstaculos[i];
                obs.x -= 4; // Velocidade que o bloco vem na sua direção
                ctx.fillRect(obs.x, obs.y, obs.largura, obs.altura);

                // Verifica se você bateu no bloco
                if (50 < obs.x + obs.largura && // 50 é a posição X fixa do jogador
                    50 + 20 > obs.x &&
                    meuJogador.y < obs.y + obs.altura &&
                    20 + meuJogador.y > obs.y) {
                    
                    jogoRodando = false; // Bateu!
                }
            }

            // Limpa obstáculos antigos da memória
            obstaculos = obstaculos.filter(obs => obs.x + obs.largura > 0);

            // Mostra os pontos
            ctx.fillStyle = "#333";
            ctx.font = "16px Arial";
            ctx.fillText("Pontos: " + Math.floor(pontuacao / 10), 10, 25);

            // ==========================================
            // DESENHA OS JOGADORES
            // ==========================================
            
            // 1. Desenha os outros
            for (let id in todosJogadores) {
                if (id !== meuId) {
                    let jogadorAlvo = todosJogadores[id];
                    ctx.fillStyle = jogadorAlvo.cor;
                    ctx.fillRect(50, jogadorAlvo.y, 20, 20);
                }
            }

            // 2. Desenha você (com borda preta para destacar)
            ctx.fillStyle = meuJogador.cor;
            ctx.fillRect(50, meuJogador.y, 20, 20);
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;
            ctx.strokeRect(50, meuJogador.y, 20, 20);
        }

        loopMotor();
    </script>
</body>
</html>
