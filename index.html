<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkour Multiplayer</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e0e0e0;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #fff;
            border: 3px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .status { margin-top: 10px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <canvas id="jogoCanvas" width="600" height="200"></canvas>
    <div class="status" id="statusTexto">Conectando ao servidor...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5e1np_A_YmEruPJ8tvXbitNA07X42CeM",
            authDomain: "parkour-871d9.firebaseapp.com",
            databaseURL: "https://parkour-871d9-default-rtdb.firebaseio.com",
            projectId: "parkour-871d9",
            storageBucket: "parkour-871d9.firebasestorage.app",
            messagingSenderId: "556878698255",
            appId: "1:556878698255:web:1fd4d9d2013bd15d1c107a",
            measurementId: "G-RT17LJYHYF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const meuId = "jogador_" + Math.random().toString(36).substr(2, 9);
        const jogadorRef = ref(db, 'jogadores/' + meuId);
        onDisconnect(jogadorRef).remove(); 

        const canvas = document.getElementById("jogoCanvas");
        const ctx = canvas.getContext("2d");

        let meuJogador = {
            id: meuId,
            y: 150,
            cor: "#" + Math.floor(Math.random()*16777215).toString(16),
            velocidadeY: 0,
            noChao: true,
            vivo: true // <-- NOVO: Diz se você está vivo ou morto
        };

        let todosJogadores = {};
        
        let obstaculos = [];
        let frame = 0;
        let pontuacao = 0;
        let pontuacaoMaxima = 0; // <-- NOVO: Guarda o recorde
        let jogoRodando = true;

        document.getElementById("statusTexto").innerText = "Conectado! Pressione ESPAÇO para pular.";

        const jogadoresRef = ref(db, 'jogadores');
        onValue(jogadoresRef, (snapshot) => {
            const dados = snapshot.val();
            todosJogadores = dados ? dados : {};
        });

        function pular() {
            if (meuJogador.noChao && jogoRodando) {
                meuJogador.velocidadeY = -10;
                meuJogador.noChao = false;
            } else if (!jogoRodando) {
                // Ressuscita e zera tudo
                obstaculos = [];
                pontuacao = 0;
                frame = 0;
                meuJogador.y = 150;
                meuJogador.velocidadeY = 0;
                meuJogador.vivo = true; // Volta a ficar visível
                jogoRodando = true;
            }
        }
        document.addEventListener("keydown", (e) => { if (e.code === "Space") pular(); });
        canvas.addEventListener("mousedown", pular);

        // Envia sua posição E SEU STATUS DE VIDA para o Firebase
        setInterval(() => {
            set(jogadorRef, { 
                y: meuJogador.y, 
                cor: meuJogador.cor, 
                vivo: meuJogador.vivo // Envia para os outros saberem se você bateu
            });
        }, 30);

        function loopMotor() {
            requestAnimationFrame(loopMotor);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ==========================================
            // TELA DE GAME OVER (Agora com Recorde)
            // ==========================================
            if (!jogoRodando) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "white";
                ctx.font = "bold 24px Arial";
                ctx.fillText("Você Bateu!", 230, 70);
                
                // Mostra a pontuação
                let pontosAtuais = Math.floor(pontuacao / 10);
                ctx.font = "18px Arial";
                ctx.fillStyle = "#FFD700"; // Cor dourada
                ctx.fillText("Recorde: " + pontuacaoMaxima, 255, 105);
                ctx.fillStyle = "white";
                ctx.fillText("Pontos dessa rodada: " + pontosAtuais, 215, 130);

                ctx.font = "14px Arial";
                ctx.fillStyle = "#ccc";
                ctx.fillText("Pressione Espaço para tentar de novo", 185, 170);
                return; // Pausa a animação
            }

            // Física
            meuJogador.velocidadeY += 0.6; 
            meuJogador.y += meuJogador.velocidadeY;

            if (meuJogador.y >= 150) {
                meuJogador.y = 150;
                meuJogador.velocidadeY = 0;
                meuJogador.noChao = true;
            }

            frame++;
            pontuacao++;

            if (frame % 90 === 0) {
                obstaculos.push({ x: canvas.width, y: 130, largura: 20, altura: 40 });
            }

            ctx.fillStyle = "#DC3545"; 
            for (let i = 0; i < obstaculos.length; i++) {
                let obs = obstaculos[i];
                obs.x -= 4; 
                ctx.fillRect(obs.x, obs.y, obs.largura, obs.altura);

                // COLISÃO: O que acontece quando bate
                if (50 < obs.x + obs.largura && 
                    50 + 20 > obs.x &&
                    meuJogador.y < obs.y + obs.altura &&
                    20 + meuJogador.y > obs.y) {
                    
                    jogoRodando = false; 
                    meuJogador.vivo = false; // Fica invisível
                    
                    // Verifica se bateu o recorde
                    let pontosAtuais = Math.floor(pontuacao / 10);
                    if (pontosAtuais > pontuacaoMaxima) {
                        pontuacaoMaxima = pontosAtuais;
                    }
                }
            }

            obstaculos = obstaculos.filter(obs => obs.x + obs.largura > 0);

            // Placar em tempo real
            ctx.fillStyle = "#333";
            ctx.font = "bold 16px Arial";
            ctx.fillText("Pontos: " + Math.floor(pontuacao / 10), 10, 25);
            ctx.fillStyle = "#666";
            ctx.font = "14px Arial";
            ctx.fillText("Recorde: " + pontuacaoMaxima, 10, 45);

            // ==========================================
            // DESENHA OS JOGADORES (Só se estiverem vivos)
            // ==========================================
            
            // Desenha os outros
            for (let id in todosJogadores) {
                if (id !== meuId) {
                    let jogadorAlvo = todosJogadores[id];
                    // Só desenha se a propriedade "vivo" for verdadeira
                    if (jogadorAlvo.vivo) { 
                        ctx.fillStyle = jogadorAlvo.cor;
                        ctx.fillRect(50, jogadorAlvo.y, 20, 20);
                    }
                }
            }

            // Desenha você (só se estiver vivo)
            if (meuJogador.vivo) {
                ctx.fillStyle = meuJogador.cor;
                ctx.fillRect(50, meuJogador.y, 20, 20);
                ctx.strokeStyle = "black";
                ctx.lineWidth = 2;
                ctx.strokeRect(50, meuJogador.y, 20, 20);
            }
        }

        loopMotor();
    </script>
</body>
</html>
