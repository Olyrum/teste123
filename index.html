<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Atendimento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #0056b3;
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            text-align: center;
            font-size: 1.1em;
        }
        select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }
        select {
            text-align: center;
            margin-bottom: 10px;
        }
        textarea {
            resize: vertical; /* Permite aumentar a caixa de texto apenas para baixo */
        }
        .contador {
            display: block;
            text-align: right;
            font-size: 0.8em;
            color: #666;
            margin-top: 3px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .oculto {
            display: none !important;
        }
        .mensagem-sucesso {
            text-align: center;
            margin-top: 20px;
        }
        .mensagem-sucesso h3 {
            color: #28a745;
        }
        .mensagem-sucesso p {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Avalie nosso atendimento</h2>

        <div id="tela-sucesso" class="mensagem-sucesso oculto">
            <h3>Obrigado pela sua avaliação!</h3>
            <p>Sua nota foi registrada com sucesso.</p>
            <p>Para fazer uma nova avaliação, feche esta página e abra novamente.</p>
        </div>

        <form id="form-avaliacao">
            <label for="nota">Que nota você dá para o seu atendimento?</label>
            <select id="nota" name="Nota" required>
                <option value="" disabled selected>Selecione uma nota de 1 a 4</option>
                <option value="1">1 - Ruim</option>
                <option value="2">2 - Regular</option>
                <option value="3">3 - Bom</option>
                <option value="4">4 - Ótimo</option>
            </select>

            <label for="motivo" style="font-size: 0.9em; margin-top: 20px;">Por que você deu essa nota? (Opcional)</label>
            <textarea id="motivo" name="Motivo" rows="3" maxlength="200" placeholder="Deixe um comentário curto..."></textarea>
            <span class="contador" id="contador-caracteres">0 / 200</span>

            <button type="submit" id="btn-salvar">Enviar Avaliação</button>
        </form>
    </div>

    <script>
        // COLOQUE O SEU LINK DO APPS SCRIPT AQUI ENTRE AS ASPAS
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyQaNYGLuuuUlAqTHXwk5eBXZBa0J6N1eZzXGDGbYu9Pu43ZL_Rt8Cf9ilSbdc4UV2UWg/exec';
        
        const form = document.getElementById('form-avaliacao');
        const btnSalvar = document.getElementById('btn-salvar');
        const telaSucesso = document.getElementById('tela-sucesso');
        const motivoInput = document.getElementById('motivo');
        const contador = document.getElementById('contador-caracteres');

        // Atualiza o contador de caracteres conforme a pessoa digita
        motivoInput.addEventListener('input', function() {
            contador.textContent = this.value.length + ' / 200';
        });

        // Verifica se a pessoa já avaliou nesta sessão
        if (sessionStorage.getItem('jaAvaliou') === 'sim') {
            form.classList.add('oculto');
            telaSucesso.classList.remove('oculto');
        }

        form.addEventListener('submit', e => {
            e.preventDefault(); 
            
            btnSalvar.innerText = 'Enviando...';
            btnSalvar.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    sessionStorage.setItem('jaAvaliou', 'sim');
                    form.classList.add('oculto');
                    telaSucesso.classList.remove('oculto');
                })
                .catch(error => {
                    console.error('Erro!', error.message);
                    alert('Houve um erro de conexão ao enviar. Tente novamente.');
                    btnSalvar.innerText = 'Enviar Avaliação';
                    btnSalvar.disabled = false;
                });
        });
    </script>

</body>
</html>
