<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Simulator</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        canvas {
            background-color: #eee;
            border-radius: 5px;
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            width: 80%;
            margin-bottom: 15px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover { background-color: #e68a00; }
        button:disabled { background-color: #777; cursor: not-allowed; }
        .oculto { display: none !important; }
        
        .ranking-lista {
            text-align: left;
            background: #444;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #555;
        }
    </style>
</head>
<body>

    <div class="container" id="tela-login">
        <h1>🦖 Dino Simulator</h1>
        <p>Digite seu nick para jogar e entrar no ranking!</p>
        <input type="text" id="nick" placeholder="Seu Nickname" maxlength="15">
        <button id="btn-iniciar">Iniciar Jogo</button>
        <button id="btn-ver-ranking" style="background-color: #2196F3;">Ver Ranking</button>
    </div>

    <div class="container oculto" id="tela-jogo">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span id="display-nick" style="font-weight: bold; color: #ff9800;"></span>
            <span id="display-pontos" style="font-weight: bold;">Score: 0</span>
        </div>
        <canvas id="gameCanvas" width="500" height="200"></canvas>
        <p style="font-size: 0.8em; color: #aaa; margin-top: 10px;">Aperte <strong>ESPAÇO</strong> ou toque na tela para pular!</p>
    </div>

    <div class="container oculto" id="tela-gameover">
        <h1 style="color: #f44336;">Fim de Jogo! 💥</h1>
        <h2>Sua Pontuação: <span id="pontuacao-final">0</span></h2>
        <button id="btn-salvar-score">Salvar no Ranking</button>
        <button id="btn-jogar-novamente" style="background-color: #4CAF50;">Jogar Novamente</button>
    </div>

    <div class="container oculto" id="tela-ranking">
        <h1>🏆 Ranking Global</h1>
        <div id="carregando-ranking">Buscando os melhores jogadores...</div>
        <div class="ranking-lista" id="lista-ranking"></div>
        <button id="btn-voltar-ranking" style="margin-top: 20px;">Voltar</button>
    </div>

    <script>
        // COLOQUE O SEU LINK DO APPS SCRIPT AQUI ENTRE AS ASPAS
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxzNluYXCbfC0YiBdXk2u1vC8f1EnX7Di-fNMS7TYyY-DhO4-Q1If_ZyYOvxuVuvg6dtQ/exec';
        
        // Elementos da Tela
        const telaLogin = document.getElementById('tela-login');
        const telaJogo = document.getElementById('tela-jogo');
        const telaGameOver = document.getElementById('tela-gameover');
        const telaRanking = document.getElementById('tela-ranking');
        
        let nickAtual = "";
        let pontuacaoAtual = 0;
        let jogoRodando = false;

        // Configurações do Jogo (Canvas)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let dino = { x: 50, y: 150, width: 30, height: 30, dy: 0, pulando: false };
        let cactos = [];
        let timerCactos = 0;
        const gravidade = 0.6;
        let velocidadeJogo = 5;
        let animacaoFrame;

        // Controle de Telas
        function mostrarTela(tela) {
            telaLogin.classList.add('oculto');
            telaJogo.classList.add('oculto');
            telaGameOver.classList.add('oculto');
            telaRanking.classList.add('oculto');
            tela.classList.remove('oculto');
        }

        // Lógica do Pulo
        function pular() {
            if (!dino.pulando && jogoRodando) {
                dino.dy = -12;
                dino.pulando = true;
            }
        }
        document.addEventListener('keydown', (e) => { if (e.code === 'Space') pular(); });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); pular(); });

        // Loop Principal do Jogo
        function atualizarJogo() {
            if (!jogoRodando) return;

            // Limpa a tela
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Física do Dino
            dino.dy += gravidade;
            dino.y += dino.dy;
            if (dino.y >= 150) {
                dino.y = 150;
                dino.pulando = false;
            }

            // Desenha Dino (usando Emoji para facilitar)
            ctx.font = "30px Arial";
            ctx.fillText("🦖", dino.x, dino.y + 25);

            // Geração de Cactos
            timerCactos++;
            if (timerCactos > Math.random() * 60 + 50) {
                cactos.push({ x: canvas.width, y: 150, width: 20, height: 30 });
                timerCactos = 0;
            }

            // Move e desenha Cactos
            for (let i = 0; i < cactos.length; i++) {
                let c = cactos[i];
                c.x -= velocidadeJogo;
                ctx.fillText("🌵", c.x, c.y + 25);

                // Colisão (Aproximada)
                if (dino.x < c.x + c.width && dino.x + dino.width > c.x && 
                    dino.y < c.y + c.height && dino.height + dino.y > c.y) {
                    gameOver();
                }
            }

            // Remove cactos que saíram da tela e aumenta pontos
            cactos = cactos.filter(c => {
                if (c.x < -30) {
                    pontuacaoAtual += 10;
                    document.getElementById('display-pontos').innerText = "Score: " + pontuacaoAtual;
                    // Aumenta a velocidade aos poucos
                    if (pontuacaoAtual % 100 === 0) velocidadeJogo += 0.5;
                    return false;
                }
                return true;
            });

            animacaoFrame = requestAnimationFrame(atualizarJogo);
        }

        function iniciarJogo() {
            dino.y = 150;
            dino.dy = 0;
            cactos = [];
            pontuacaoAtual = 0;
            velocidadeJogo = 5;
            document.getElementById('display-pontos').innerText = "Score: 0";
            jogoRodando = true;
            mostrarTela(telaJogo);
            atualizarJogo();
        }

        function gameOver() {
            jogoRodando = false;
            cancelAnimationFrame(animacaoFrame);
            document.getElementById('pontuacao-final').innerText = pontuacaoAtual;
            mostrarTela(telaGameOver);
            document.getElementById('btn-salvar-score').disabled = false;
            document.getElementById('btn-salvar-score').innerText = "Salvar no Ranking";
        }

        // --- BOTÕES E FLUXO ---
        document.getElementById('btn-iniciar').addEventListener('click', () => {
            let n = document.getElementById('nick').value.trim();
            if (n === "") { alert("Digite um nick!"); return; }
            nickAtual = n;
            document.getElementById('display-nick').innerText = "Jogador: " + nickAtual;
            iniciarJogo();
        });

        document.getElementById('btn-jogar-novamente').addEventListener('click', iniciarJogo);

        // Salvar Score no Google Sheets
        document.getElementById('btn-salvar-score').addEventListener('click', () => {
            const btn = document.getElementById('btn-salvar-score');
            btn.innerText = 'Salvando...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('Nick', nickAtual);
            formData.append('Pontos', pontuacaoAtual);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    alert("Pontuação salva com sucesso!");
                    abrirRanking();
                })
                .catch(error => {
                    alert('Erro ao salvar.');
                    btn.innerText = 'Tentar Novamente';
                    btn.disabled = false;
                });
        });

        // Ver Ranking
        document.getElementById('btn-ver-ranking').addEventListener('click', abrirRanking);
        document.getElementById('btn-voltar-ranking').addEventListener('click', () => mostrarTela(telaLogin));

        function abrirRanking() {
            mostrarTela(telaRanking);
            const lista = document.getElementById('lista-ranking');
            const status = document.getElementById('carregando-ranking');
            lista.innerHTML = "";
            status.style.display = "block";

            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    status.style.display = "none";
                    if (data.length === 0) {
                        lista.innerHTML = "<p style='text-align:center;'>Ninguém jogou ainda. Seja o primeiro!</p>";
                        return;
                    }
                    data.forEach((jogador, index) => {
                        let medalha = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "👾";
                        lista.innerHTML += `
                            <div class="ranking-item">
                                <span>${medalha} <strong>${jogador.nick}</strong></span>
                                <span style="color:#ff9800; font-weight:bold;">${jogador.pontos} pts</span>
                            </div>
                        `;
                    });
                }).catch(err => {
                    status.innerText = "Erro ao carregar o ranking.";
                });
        }
    </script>
</body>
</html>
