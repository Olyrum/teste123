<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Battlegrounds</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            background-color: #ecf0f1;
            border: 4px solid #34495e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 8px;
            cursor: crosshair; /* Muda o mouse para uma mira */
        }
        /* Tela de Login sobreposta ao jogo */
        #telaLogin {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }
        input, select, button {
            font-size: 16px;
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2ecc71; }
    </style>
</head>
<body>

    <div id="telaLogin">
        <h2>Entrar na Arena</h2>
        <input type="text" id="inputNome" placeholder="Digite seu Nickname" maxlength="12">
        <select id="selectClasse">
            <option value="balanceado">O Balanceado (Azul) - Normal</option>
            <option value="pesadao">O Pesadão (Verde) - Lento, Muito HP</option>
            <option value="ligeirinho">O Ligeirinho (Laranja) - Rápido, Pouco HP</option>
        </select>
        <button id="btnJogar">Entrar no Jogo</button>
    </div>

    <canvas id="jogoCanvas" width="800" height="600"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // SUAS CHAVES (Mantidas intactas)
        const firebaseConfig = {
            apiKey: "AIzaSyB5e1np_A_YmEruPJ8tvXbitNA07X42CeM",
            authDomain: "parkour-871d9.firebaseapp.com",
            databaseURL: "https://parkour-871d9-default-rtdb.firebaseio.com",
            projectId: "parkour-871d9",
            storageBucket: "parkour-871d9.firebasestorage.app",
            messagingSenderId: "556878698255",
            appId: "1:556878698255:web:1fd4d9d2013bd15d1c107a",
            measurementId: "G-RT17LJYHYF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Referências do Canvas
        const canvas = document.getElementById("jogoCanvas");
        const ctx = canvas.getContext("2d");

        // Status das Classes
        const ATRIBUTOS = {
            'balanceado': { cor: '#3498db', maxHp: 100, velocidade: 4, dano: 20, recargaTiro: 300, tamTiro: 5, velTiro: 8, tamanho: 15 },
            'pesadao': { cor: '#2ecc71', maxHp: 200, velocidade: 2, dano: 35, recargaTiro: 700, tamTiro: 10, velTiro: 5, tamanho: 20 },
            'ligeirinho': { cor: '#e67e22', maxHp: 60, velocidade: 6, dano: 10, recargaTiro: 150, tamTiro: 4, velTiro: 12, tamanho: 12 }
        };

        // Variáveis do Jogador
        let meuId = "jog_" + Math.random().toString(36).substr(2, 9);
        let jogadorRef = ref(db, 'arena/' + meuId);
        let jogoRodando = false;
        
        let meuJogador = {
            nome: "", classe: "", x: 400, y: 300, hp: 100, maxHp: 100, 
            kills: 0, deaths: 0, cor: "", tamanho: 15
        };

        let todosJogadores = {};
        let meusTiros = []; // Tiros que você disparou
        let teclas = { w: false, a: false, s: false, d: false };
        let podeAtirar = true;
        let mouseX = 0; let mouseY = 0;

        // Entrar no Jogo
        document.getElementById("btnJogar").addEventListener("click", () => {
            let nomeInput = document.getElementById("inputNome").value.trim();
            if (nomeInput === "") return alert("Digite um nome!");
            
            let classeEscolhida = document.getElementById("selectClasse").value;
            let status = ATRIBUTOS[classeEscolhida];

            meuJogador.nome = nomeInput;
            meuJogador.classe = classeEscolhida;
            meuJogador.cor = status.cor;
            meuJogador.hp = status.maxHp;
            meuJogador.maxHp = status.maxHp;
            meuJogador.tamanho = status.tamanho;
            
            // Nasce em um lugar aleatório
            meuJogador.x = Math.random() * (canvas.width - 50) + 25;
            meuJogador.y = Math.random() * (canvas.height - 50) + 25;

            document.getElementById("telaLogin").style.display = "none";
            
            onDisconnect(jogadorRef).remove(); // Sai do servidor se fechar a aba
            jogoRodando = true;
            loopMotor();
        });

        // Controles de Teclado
        window.addEventListener("keydown", (e) => {
            if(e.key === "w" || e.key === "W") teclas.w = true;
            if(e.key === "a" || e.key === "A") teclas.a = true;
            if(e.key === "s" || e.key === "S") teclas.s = true;
            if(e.key === "d" || e.key === "D") teclas.d = true;
        });
        window.addEventListener("keyup", (e) => {
            if(e.key === "w" || e.key === "W") teclas.w = false;
            if(e.key === "a" || e.key === "A") teclas.a = false;
            if(e.key === "s" || e.key === "S") teclas.s = false;
            if(e.key === "d" || e.key === "D") teclas.d = false;
        });

        // Mira do Mouse
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // Atirar (Clique)
        canvas.addEventListener("mousedown", () => {
            if (!jogoRodando || meuJogador.hp <= 0 || !podeAtirar) return;
            
            let status = ATRIBUTOS[meuJogador.classe];
            
            // Direção do tiro
            let angulo = Math.atan2(mouseY - meuJogador.y, mouseX - meuJogador.x);
            
            meusTiros.push({
                x: meuJogador.x,
                y: meuJogador.y,
                vx: Math.cos(angulo) * status.velTiro,
                vy: Math.sin(angulo) * status.velTiro,
                dano: status.dano,
                tamanho: status.tamTiro
            });

            podeAtirar = false;
            setTimeout(() => { podeAtirar = true; }, status.recargaTiro); // Tempo de recarga
        });

        // Escuta os outros jogadores
        onValue(ref(db, 'arena'), (snapshot) => {
            todosJogadores = snapshot.val() || {};
            
            // Verifica se ALGUÉM te matou (seu HP no servidor ficou 0 ou menos)
            if (todosJogadores[meuId] && todosJogadores[meuId].hp <= 0 && meuJogador.hp > 0) {
                meuJogador.hp = 0;
                meuJogador.deaths++;
                
                // Renasce após 3 segundos
                setTimeout(() => {
                    meuJogador.hp = meuJogador.maxHp;
                    meuJogador.x = Math.random() * (canvas.width - 50) + 25;
                    meuJogador.y = Math.random() * (canvas.height - 50) + 25;
                }, 3000);
            }
        });

        // Sincroniza seus dados com a nuvem (a cada 30ms)
        setInterval(() => {
            if (!jogoRodando) return;
            
            // Prepara seus tiros para os outros verem
            let tirosParaEnviar = meusTiros.map(t => ({ x: t.x, y: t.y, tam: t.tamanho }));

            set(jogadorRef, {
                nome: meuJogador.nome,
                cor: meuJogador.cor,
                hp: meuJogador.hp,
                maxHp: meuJogador.maxHp,
                kills: meuJogador.kills,
                deaths: meuJogador.deaths,
                x: meuJogador.x,
                y: meuJogador.y,
                tamanho: meuJogador.tamanho,
                tirosVisiveis: tirosParaEnviar // Os outros vão desenhar bolinhas aqui
            });
        }, 30);

        function loopMotor() {
            if (!jogoRodando) return;
            requestAnimationFrame(loopMotor);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let status = ATRIBUTOS[meuJogador.classe];

            // 1. MOVIMENTAÇÃO (Só anda se estiver vivo)
            if (meuJogador.hp > 0) {
                if (teclas.w && meuJogador.y > 0) meuJogador.y -= status.velocidade;
                if (teclas.s && meuJogador.y < canvas.height) meuJogador.y += status.velocidade;
                if (teclas.a && meuJogador.x > 0) meuJogador.x -= status.velocidade;
                if (teclas.d && meuJogador.x < canvas.width) meuJogador.x += status.velocidade;
            }

            // 2. ATUALIZA E DESENHA SEUS TIROS
            ctx.fillStyle = "#333";
            for (let i = meusTiros.length - 1; i >= 0; i--) {
                let t = meusTiros[i];
                t.x += t.vx;
                t.y += t.vy;

                ctx.beginPath();
                ctx.arc(t.x, t.y, t.tamanho, 0, Math.PI * 2);
                ctx.fill();

                // Colisão do SEU tiro com OUTROS jogadores
                let tiroBateu = false;
                for (let id in todosJogadores) {
                    if (id !== meuId && todosJogadores[id].hp > 0) {
                        let inimigo = todosJogadores[id];
                        // Cálculo simples de distância (se o tiro encostou)
                        let dist = Math.hypot(inimigo.x - t.x, inimigo.y - t.y);
                        
                        if (dist < inimigo.tamanho + t.tamanho) {
                            tiroBateu = true;
                            // Dá dano no inimigo direto no Firebase
                            let novoHpInimigo = inimigo.hp - t.dano;
                            set(ref(db, 'arena/' + id + '/hp'), novoHpInimigo);
                            
                            // Se o tiro matou o inimigo, você ganha 1 Kill
                            if (novoHpInimigo <= 0 && inimigo.hp > 0) {
                                meuJogador.kills++;
                            }
                        }
                    }
                }

                // Remove o tiro se ele bater ou sair da tela
                if (tiroBateu || t.x < 0 || t.x > canvas.width || t.y < 0 || t.y > canvas.height) {
                    meusTiros.splice(i, 1);
                }
            }

            // 3. DESENHA TODOS OS JOGADORES (Incluindo você)
            for (let id in todosJogadores) {
                let jog = todosJogadores[id];
                
                // Se for você, usa seus dados locais para não ter "lag" de movimento
                if (id === meuId) jog = meuJogador;

                if (jog.hp > 0) {
                    // Desenha o Boneco (Círculo)
                    ctx.fillStyle = jog.cor;
                    ctx.beginPath();
                    ctx.arc(jog.x, jog.y, jog.tamanho, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "black";
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Barra de Vida (HP)
                    let larguraBarra = 40;
                    let hpPercent = Math.max(0, jog.hp / jog.maxHp);
                    ctx.fillStyle = "red";
                    ctx.fillRect(jog.x - larguraBarra/2, jog.y - jog.tamanho - 15, larguraBarra, 5);
                    ctx.fillStyle = "lime";
                    ctx.fillRect(jog.x - larguraBarra/2, jog.y - jog.tamanho - 15, larguraBarra * hpPercent, 5);

                    // Nome e K/D
                    ctx.fillStyle = "#333";
                    ctx.font = "12px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(jog.nome, jog.x, jog.y - jog.tamanho - 20);
                    ctx.fillStyle = "#666";
                    ctx.font = "10px Arial";
                    ctx.fillText(`${jog.kills} K / ${jog.deaths} D`, jog.x, jog.y + jog.tamanho + 15);
                }

                // Desenha os tiros desse jogador (para você ver os tiros dos inimigos)
                if (id !== meuId && jog.tirosVisiveis) {
                    ctx.fillStyle = "#555";
                    jog.tirosVisiveis.forEach(tiro => {
                        ctx.beginPath();
                        ctx.arc(tiro.x, tiro.y, tiro.tam, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
            }

            // Tela de Morte (Aparece só para você se você morrer)
            if (meuJogador.hp <= 0) {
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText("VOCÊ MORREU!", canvas.width/2, canvas.height/2);
                ctx.font = "16px Arial";
                ctx.fillText("Renasçendo em 3 segundos...", canvas.width/2, canvas.height/2 + 30);
            }
            
            // Mira (Reticula)
            if (meuJogador.hp > 0) {
                ctx.strokeStyle = "rgba(255, 0, 0, 0.5)";
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 10, 0, Math.PI * 2);
                ctx.moveTo(mouseX - 15, mouseY); ctx.lineTo(mouseX + 15, mouseY);
                ctx.moveTo(mouseX, mouseY - 15); ctx.lineTo(mouseX, mouseY + 15);
                ctx.stroke();
            }
        }
    </script>
</body>
</html>
