<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena Battlegrounds - Mobile & PC</title>
    <style>
        body { 
            margin: 0; background-color: #2c3e50; font-family: Arial, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; touch-action: none; /* Evita zoom no celular */
        }
        
        /* O Canvas agora se adapta à tela do celular */
        canvas { 
            background-color: #ecf0f1; border: 4px solid #34495e; 
            border-radius: 8px; cursor: crosshair; 
            max-width: 100vw; max-height: 100vh; object-fit: contain;
        }

        #telaLogin { 
            position: absolute; background: rgba(255, 255, 255, 0.95); 
            padding: 30px; border-radius: 10px; text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10; width: 80%; max-width: 300px;
        }
        input, select, button { font-size: 16px; padding: 10px; margin: 10px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2ecc71; }

        /* Controles Mobile (Escondidos no PC, visíveis em telas menores) */
        #controlesMobile {
            display: none;
            position: absolute; bottom: 20px; width: 100%; max-width: 800px;
            justify-content: space-between; padding: 0 20px; box-sizing: border-box;
            pointer-events: none; /* Deixa o clique passar para o canvas onde não tem botão */
            z-index: 5;
        }
        .dpad, .skills-pad { pointer-events: auto; display: grid; gap: 5px; }
        
        .dpad { grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px; }
        .dpad .up { grid-column: 2; grid-row: 1; }
        .dpad .left { grid-column: 1; grid-row: 2; }
        .dpad .down { grid-column: 2; grid-row: 2; }
        .dpad .right { grid-column: 3; grid-row: 2; }

        .skills-pad { grid-template-columns: 55px 55px; grid-template-rows: 55px 55px; justify-items: end; align-items: end;}
        .skills-pad .btn-shift { grid-column: 1 / span 2; width: 100%; }

        .btn-mobile {
            width: 100%; height: 100%; background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(0, 0, 0, 0.5); border-radius: 50%;
            font-weight: bold; font-size: 16px; color: #333;
            display: flex; justify-content: center; align-items: center;
            user-select: none;
        }
        .btn-mobile:active { background: rgba(255, 255, 255, 0.8); }

        /* Mostra os controles apenas em telas de celular/tablet */
        @media (max-width: 850px) {
            #controlesMobile { display: flex; }
            canvas { border: none; border-radius: 0; }
        }
    </style>
</head>
<body>

    <div id="telaLogin">
        <h2>Entrar na Arena</h2>
        <input type="text" id="inputNome" placeholder="Seu Nickname" maxlength="12">
        <select id="selectClasse">
            <option value="balanceado">Balanceado (Azul) - Normal</option>
            <option value="pesadao">Pesadão (Verde) - Tanque</option>
            <option value="ligeirinho">Ligeirinho (Laranja) - Ágil</option>
        </select>
        <button id="btnJogar">Entrar no Jogo</button>
    </div>

    <div id="controlesMobile">
        <div class="dpad">
            <div id="btnW" class="btn-mobile up">W</div>
            <div id="btnA" class="btn-mobile left">A</div>
            <div id="btnS" class="btn-mobile down">S</div>
            <div id="btnD" class="btn-mobile right">D</div>
        </div>
        <div class="skills-pad">
            <div id="btnQ" class="btn-mobile">Q</div>
            <div id="btnE" class="btn-mobile">E</div>
            <div id="btnShift" class="btn-mobile btn-shift">SHIFT</div>
        </div>
    </div>

    <canvas id="jogoCanvas" width="800" height="600"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5e1np_A_YmEruPJ8tvXbitNA07X42CeM",
            authDomain: "parkour-871d9.firebaseapp.com",
            databaseURL: "https://parkour-871d9-default-rtdb.firebaseio.com",
            projectId: "parkour-871d9",
            storageBucket: "parkour-871d9.firebasestorage.app",
            messagingSenderId: "556878698255",
            appId: "1:556878698255:web:1fd4d9d2013bd15d1c107a",
            measurementId: "G-RT17LJYHYF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const canvas = document.getElementById("jogoCanvas");
        const ctx = canvas.getContext("2d");

        const ATRIBUTOS = {
            'balanceado': { cor: '#3498db', maxHp: 100, vel: 4, dano: 15, recarga: 300, skills: { q: { nome: "Tiro Triplo", cdMax: 300 }, e: { nome: "Curativo", cdMax: 600 }, shift: { nome: "Escudo", cdMax: 480 } } },
            'pesadao': { cor: '#2ecc71', maxHp: 200, vel: 2, dano: 30, recarga: 700, skills: { q: { nome: "Tiro Pesado", cdMax: 240 }, e: { nome: "Endurecer", cdMax: 600 }, shift: { nome: "Fúria", cdMax: 540 } } },
            'ligeirinho': { cor: '#e67e22', maxHp: 60, vel: 5.5, dano: 8, recarga: 150, skills: { q: { nome: "Rajada", cdMax: 240 }, e: { nome: "Invisível", cdMax: 720 }, shift: { nome: "Dash", cdMax: 180 } } }
        };

        let meuId = "jog_" + Math.random().toString(36).substr(2, 9);
        let jogadorRef = ref(db, 'arena/' + meuId);
        let jogoRodando = false;
        
        let meuJogador = { nome: "", classe: "", x: 400, y: 300, hp: 100, maxHp: 100, kills: 0, deaths: 0, cor: "", estado: "normal" };
        let todosJogadores = {};
        let meusTiros = [];
        let teclas = { w: false, a: false, s: false, d: false };
        let cooldowns = { q: 0, e: 0, shift: 0 };
        let podeAtirar = true;
        let mouseX = 0, mouseY = 0;

        document.getElementById("btnJogar").addEventListener("click", () => {
            let nomeInput = document.getElementById("inputNome").value.trim();
            if (!nomeInput) return alert("Digite um nome!");
            
            let classe = document.getElementById("selectClasse").value;
            let sts = ATRIBUTOS[classe];

            meuJogador.nome = nomeInput; meuJogador.classe = classe; meuJogador.cor = sts.cor;
            meuJogador.hp = sts.maxHp; meuJogador.maxHp = sts.maxHp;
            meuJogador.x = Math.random() * (canvas.width - 50) + 25; meuJogador.y = Math.random() * (canvas.height - 100) + 25;

            document.getElementById("telaLogin").style.display = "none";
            onDisconnect(jogadorRef).remove();
            jogoRodando = true;
            loopMotor();
        });

        // ==========================================
        // CONTROLES DE PC (TECLADO E MOUSE)
        // ==========================================
        window.addEventListener("keydown", (e) => {
            let k = e.key.toLowerCase();
            if(k === "w") teclas.w = true; if(k === "a") teclas.a = true; if(k === "s") teclas.s = true; if(k === "d") teclas.d = true;
            if((k === "q" || k === "e" || k === "shift") && jogoRodando && meuJogador.hp > 0) usarSkill(k);
        });
        window.addEventListener("keyup", (e) => {
            let k = e.key.toLowerCase();
            if(k === "w") teclas.w = false; if(k === "a") teclas.a = false; if(k === "s") teclas.s = false; if(k === "d") teclas.d = false;
        });
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });
        canvas.addEventListener("mousedown", atirar);

        // ==========================================
        // CONTROLES MOBILE (TOQUE NA TELA)
        // ==========================================
        function configBotaoTouch(idBotao, teclaMapeada, tipo) {
            let btn = document.getElementById(idBotao);
            btn.addEventListener("touchstart", (e) => {
                e.preventDefault(); // Evita dar zoom na tela
                if (tipo === "movimento") teclas[teclaMapeada] = true;
                if (tipo === "skill" && jogoRodando && meuJogador.hp > 0) usarSkill(teclaMapeada);
            });
            btn.addEventListener("touchend", (e) => {
                e.preventDefault();
                if (tipo === "movimento") teclas[teclaMapeada] = false;
            });
        }
        
        // Mapeando o D-Pad virtual
        configBotaoTouch("btnW", "w", "movimento");
        configBotaoTouch("btnA", "a", "movimento");
        configBotaoTouch("btnS", "s", "movimento");
        configBotaoTouch("btnD", "d", "movimento");
        
        // Mapeando as Skills virtuais
        configBotaoTouch("btnQ", "q", "skill");
        configBotaoTouch("btnE", "e", "skill");
        configBotaoTouch("btnShift", "shift", "skill");

        // Atirar tocando na arena (calcula o toque mesmo com a tela redimensionada)
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
            atirar();
        }, { passive: false });

        // ==========================================
        // SISTEMAS DE JOGO (TIRO, SKILLS, MOTOR)
        // ==========================================
        function atirar() {
            if (!jogoRodando || meuJogador.hp <= 0 || !podeAtirar || meuJogador.estado === "invisivel") return;
            disparar(mouseX, mouseY, ATRIBUTOS[meuJogador.classe].dano, 5, 8);
            podeAtirar = false;
            setTimeout(() => podeAtirar = true, ATRIBUTOS[meuJogador.classe].recarga);
        }

        function disparar(alvoX, alvoY, dano, tam, vel) {
            let angulo = Math.atan2(alvoY - meuJogador.y, alvoX - meuJogador.x);
            meusTiros.push({ x: meuJogador.x, y: meuJogador.y, vx: Math.cos(angulo) * vel, vy: Math.sin(angulo) * vel, dano: dano, tamanho: tam });
        }

        function usarSkill(tecla) {
            if (cooldowns[tecla] > 0) return;
            let classe = meuJogador.classe;
            cooldowns[tecla] = ATRIBUTOS[classe].skills[tecla].cdMax;

            if (classe === "balanceado") {
                if (tecla === "q") { disparar(mouseX, mouseY, 10, 5, 8); disparar(mouseX + 50, mouseY + 50, 10, 5, 8); disparar(mouseX - 50, mouseY - 50, 10, 5, 8); }
                if (tecla === "e") meuJogador.hp = Math.min(meuJogador.maxHp, meuJogador.hp + 40);
                if (tecla === "shift") { meuJogador.estado = "escudo"; setTimeout(() => meuJogador.estado = "normal", 2000); }
            } else if (classe === "pesadao") {
                if (tecla === "q") disparar(mouseX, mouseY, 45, 15, 4);
                if (tecla === "e") meuJogador.hp = Math.min(meuJogador.maxHp, meuJogador.hp + 60);
                if (tecla === "shift") { ATRIBUTOS['pesadao'].vel = 5; setTimeout(() => ATRIBUTOS['pesadao'].vel = 2, 3000); }
            } else if (classe === "ligeirinho") {
                if (tecla === "q") {
                    let tiros = 0;
                    let metralhadora = setInterval(() => { disparar(mouseX, mouseY, 5, 3, 12); tiros++; if (tiros >= 5) clearInterval(metralhadora); }, 100);
                }
                if (tecla === "e") { meuJogador.estado = "invisivel"; setTimeout(() => meuJogador.estado = "normal", 3000); }
                if (tecla === "shift") {
                    meuJogador.x += (mouseX > meuJogador.x ? 80 : -80); meuJogador.y += (mouseY > meuJogador.y ? 80 : -80);
                    meuJogador.x = Math.max(15, Math.min(canvas.width - 15, meuJogador.x)); meuJogador.y = Math.max(15, Math.min(canvas.height - 15, meuJogador.y));
                }
            }
        }

        // Cura passiva
        setInterval(() => { if (jogoRodando && meuJogador.hp > 0 && meuJogador.hp < meuJogador.maxHp) meuJogador.hp++; }, 2000);

        onValue(ref(db, 'arena'), (snapshot) => {
            todosJogadores = snapshot.val() || {};
            if (todosJogadores[meuId] && todosJogadores[meuId].hp <= 0 && meuJogador.hp > 0) {
                meuJogador.hp = 0; meuJogador.deaths++;
                setTimeout(() => {
                    meuJogador.hp = meuJogador.maxHp; meuJogador.estado = "normal";
                    meuJogador.x = Math.random() * (canvas.width - 50) + 25; meuJogador.y = Math.random() * (canvas.height - 100) + 25;
                }, 4000);
            }
        });

        setInterval(() => {
            if (!jogoRodando) return;
            let tirosEnviados = meusTiros.map(t => ({ x: t.x, y: t.y, tam: t.tamanho }));
            set(jogadorRef, {
                nome: meuJogador.nome, cor: meuJogador.cor, hp: meuJogador.hp, maxHp: meuJogador.maxHp,
                kills: meuJogador.kills, deaths: meuJogador.deaths, x: meuJogador.x, y: meuJogador.y,
                estado: meuJogador.estado, tirosVisiveis: tirosEnviados
            });
        }, 30);

        function loopMotor() {
            if (!jogoRodando) return;
            requestAnimationFrame(loopMotor);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let sts = ATRIBUTOS[meuJogador.classe];
            if (cooldowns.q > 0) cooldowns.q--; if (cooldowns.e > 0) cooldowns.e--; if (cooldowns.shift > 0) cooldowns.shift--;

            if (meuJogador.hp > 0) {
                if (teclas.w && meuJogador.y > 15) meuJogador.y -= sts.vel;
                if (teclas.s && meuJogador.y < canvas.height - 60) meuJogador.y += sts.vel;
                if (teclas.a && meuJogador.x > 15) meuJogador.x -= sts.vel;
                if (teclas.d && meuJogador.x < canvas.width - 15) meuJogador.x += sts.vel;
            }

            ctx.fillStyle = "#333";
            for (let i = meusTiros.length - 1; i >= 0; i--) {
                let t = meusTiros[i];
                t.x += t.vx; t.y += t.vy;
                ctx.beginPath(); ctx.arc(t.x, t.y, t.tamanho, 0, Math.PI * 2); ctx.fill();

                let tiroBateu = false;
                for (let id in todosJogadores) {
                    if (id !== meuId && todosJogadores[id].hp > 0 && todosJogadores[id].estado !== "invisivel") {
                        let inimigo = todosJogadores[id];
                        if (Math.hypot(inimigo.x - t.x, inimigo.y - t.y) < 15 + t.tamanho) {
                            tiroBateu = true;
                            if (inimigo.estado !== "escudo") {
                                let novoHp = inimigo.hp - t.dano;
                                set(ref(db, 'arena/' + id + '/hp'), novoHp);
                                if (novoHp <= 0 && inimigo.hp > 0) meuJogador.kills++;
                            }
                        }
                    }
                }
                if (tiroBateu || t.x < 0 || t.x > canvas.width || t.y < 0 || t.y > canvas.height) meusTiros.splice(i, 1);
            }

            for (let id in todosJogadores) {
                let jog = (id === meuId) ? meuJogador : todosJogadores[id];
                if (jog.hp > 0) {
                    ctx.globalAlpha = (jog.estado === "invisivel" && id !== meuId) ? 0 : (jog.estado === "invisivel" ? 0.3 : 1);
                    ctx.fillStyle = jog.cor; ctx.beginPath(); ctx.arc(jog.x, jog.y, 15, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = jog.estado === "escudo" ? "#00ffff" : "black"; ctx.lineWidth = jog.estado === "escudo" ? 4 : 2; ctx.stroke();

                    if (jog.estado !== "invisivel" || id === meuId) {
                        ctx.fillStyle = "red"; ctx.fillRect(jog.x - 20, jog.y - 25, 40, 5);
                        ctx.fillStyle = "lime"; ctx.fillRect(jog.x - 20, jog.y - 25, 40 * (jog.hp / jog.maxHp), 5);
                        ctx.fillStyle = "#333"; ctx.font = "12px Arial"; ctx.textAlign = "center"; ctx.fillText(jog.nome, jog.x, jog.y - 30);
                        ctx.fillStyle = "#666"; ctx.font = "10px Arial"; ctx.fillText(`${jog.kills} K / ${jog.deaths} D`, jog.x, jog.y + 25);
                    }
                    ctx.globalAlpha = 1;
                }
                if (id !== meuId && jog.tirosVisiveis) {
                    ctx.fillStyle = "#555";
                    jog.tirosVisiveis.forEach(tiro => { ctx.beginPath(); ctx.arc(tiro.x, tiro.y, tiro.tam, 0, Math.PI * 2); ctx.fill(); });
                }
            }

            if (meuJogador.hp > 0) {
                ctx.fillStyle = "#34495e"; ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
                ctx.fillStyle = "white"; ctx.font = "14px Arial"; ctx.textAlign = "left";
                ctx.fillText(`Q: ${sts.skills.q.nome} ` + (cooldowns.q > 0 ? `(${Math.ceil(cooldowns.q/60)}s)` : ""), 20, canvas.height - 20);
                ctx.fillText(`E: ${sts.skills.e.nome} ` + (cooldowns.e > 0 ? `(${Math.ceil(cooldowns.e/60)}s)` : ""), 250, canvas.height - 20);
                ctx.fillText(`SHIFT: ${sts.skills.shift.nome} ` + (cooldowns.shift > 0 ? `(${Math.ceil(cooldowns.shift/60)}s)` : ""), 480, canvas.height - 20);

                ctx.strokeStyle = "rgba(255, 0, 0, 0.5)"; ctx.beginPath(); ctx.arc(mouseX, mouseY, 10, 0, Math.PI * 2);
                ctx.moveTo(mouseX - 15, mouseY); ctx.lineTo(mouseX + 15, mouseY); ctx.moveTo(mouseX, mouseY - 15); ctx.lineTo(mouseX, mouseY + 15); ctx.stroke();
            } else {
                ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white"; ctx.font = "30px Arial"; ctx.textAlign = "center"; ctx.fillText("VOCÊ MORREU!", canvas.width/2, canvas.height/2);
            }
        }
    </script>
</body>
</html>
