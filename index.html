<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Atendimento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #0056b3;
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        /* Novas classes para esconder o formulário e mostrar a mensagem */
        .oculto {
            display: none !important;
        }
        .mensagem-sucesso {
            text-align: center;
            margin-top: 20px;
        }
        .mensagem-sucesso h3 {
            color: #28a745;
        }
        .mensagem-sucesso p {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Avalie nosso atendimento</h2>

        <div id="tela-sucesso" class="mensagem-sucesso oculto">
            <h3>Obrigado pela sua avaliação!</h3>
            <p>Sua nota foi registrada com sucesso.</p>
            <p>Para fazer uma nova avaliação, feche esta página e abra novamente.</p>
        </div>

        <form id="form-avaliacao">
            <label for="cliente">Nome do Cliente:</label>
            <input type="text" id="cliente" name="Nome" placeholder="Ex: João da Silva" required>

            <label for="nota">Nota (1 a 10):</label>
            <select id="nota" name="Nota" required>
                <option value="" disabled selected>Selecione uma nota</option>
                <option value="1">1 - Muito Ruim</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5 - Regular</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10 - Excelente</option>
            </select>

            <button type="submit" id="btn-salvar">Salvar Avaliação</button>
        </form>
    </div>

    <script>
        // COLOQUE O LINK QUE VOCÊ COPIOU DO APPS SCRIPT AQUI ENTRE AS ASPAS
        const scriptURL = 'COLE_AQUI_O_SEU_LINK_DO_APPS_SCRIPT';
        
        const form = document.getElementById('form-avaliacao');
        const btnSalvar = document.getElementById('btn-salvar');
        const telaSucesso = document.getElementById('tela-sucesso');

        // PASSO 1: Assim que a página abre, verifica se a pessoa já avaliou nesta sessão
        if (sessionStorage.getItem('jaAvaliou') === 'sim') {
            form.classList.add('oculto');
            telaSucesso.classList.remove('oculto');
        }

        // PASSO 2: O que acontece quando clica em salvar
        form.addEventListener('submit', e => {
            e.preventDefault(); 
            
            btnSalvar.innerText = 'Enviando...';
            btnSalvar.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    // Marca na memória curta do navegador que a pessoa já avaliou
                    sessionStorage.setItem('jaAvaliou', 'sim');
                    
                    // Esconde o formulário e mostra a mensagem de sucesso
                    form.classList.add('oculto');
                    telaSucesso.classList.remove('oculto');
                })
                .catch(error => {
                    console.error('Erro!', error.message);
                    alert('Houve um erro de conexão ao enviar. Tente novamente.');
                    btnSalvar.innerText = 'Salvar Avaliação';
                    btnSalvar.disabled = false;
                });
        });
    </script>

</body>
</html>
