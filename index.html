<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkour Simples</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #fff;
            border: 3px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .instrucoes {
            margin-top: 15px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="jogoCanvas" width="600" height="200"></canvas>
    
    <div class="instrucoes">
        <p><strong>Pressione ESPAÇO ou clique na tela para pular!</strong></p>
    </div>

    <script>
        const canvas = document.getElementById("jogoCanvas");
        const ctx = canvas.getContext("2d");

        // Configurações do Personagem
        let jogador = {
            x: 50,
            y: 150,
            largura: 20,
            altura: 20,
            velocidadeY: 0,
            gravidade: 0.6,
            forcaPulo: -10,
            noChao: false
        };

        let obstaculos = [];
        let frame = 0;
        let pontuacao = 0;
        let jogoAcabou = false;

        // Função para pular
        function pular() {
            if (jogador.noChao && !jogoAcabou) {
                jogador.velocidadeY = jogador.forcaPulo;
                jogador.noChao = false;
            } else if (jogoAcabou) {
                reiniciarJogo();
            }
        }

        // Controles
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") pular();
        });
        canvas.addEventListener("mousedown", pular);
        canvas.addEventListener("touchstart", pular); // Para funcionar no celular

        function reiniciarJogo() {
            jogador.y = 150;
            jogador.velocidadeY = 0;
            obstaculos = [];
            pontuacao = 0;
            frame = 0;
            jogoAcabou = false;
            loopMotor();
        }

        // O "Motor" do jogo que roda a cada quadro
        function loopMotor() {
            if (jogoAcabou) return;
            requestAnimationFrame(loopMotor);
            
            // Limpa a tela
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Física do Jogador
            jogador.velocidadeY += jogador.gravidade;
            jogador.y += jogador.velocidadeY;

            // Colisão com o chão
            if (jogador.y + jogador.altura >= canvas.height) {
                jogador.y = canvas.height - jogador.altura;
                jogador.velocidadeY = 0;
                jogador.noChao = true;
            }

            // Desenha o Jogador
            ctx.fillStyle = "#007BFF"; // Azul
            ctx.fillRect(jogador.x, jogador.y, jogador.largura, jogador.altura);

            // Criação de Obstáculos
            if (frame % 90 === 0) { // Cria um obstáculo a cada 90 frames
                let alturaObstaculo = 20 + Math.random() * 20; // Altura aleatória
                obstaculos.push({
                    x: canvas.width,
                    y: canvas.height - alturaObstaculo,
                    largura: 20,
                    altura: alturaObstaculo
                });
            }

            // Move e desenha os obstáculos
            ctx.fillStyle = "#DC3545"; // Vermelho
            for (let i = 0; i < obstaculos.length; i++) {
                let obs = obstaculos[i];
                obs.x -= 4; // Velocidade do obstáculo
                ctx.fillRect(obs.x, obs.y, obs.largura, obs.altura);

                // Sistema de Colisão Simples
                if (jogador.x < obs.x + obs.largura &&
                    jogador.x + jogador.largura > obs.x &&
                    jogador.y < obs.y + obs.altura &&
                    jogador.altura + jogador.y > obs.y) {
                    
                    jogoAcabou = true;
                    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "white";
                    ctx.font = "24px Arial";
                    ctx.fillText("Game Over!", 230, 90);
                    ctx.font = "16px Arial";
                    ctx.fillText("Clique ou pressione Espaço para tentar de novo", 140, 130);
                }
            }

            // Remove obstáculos que já saíram da tela para não pesar a memória
            obstaculos = obstaculos.filter(obs => obs.x + obs.largura > 0);

            // Pontuação e Frames
            frame++;
            pontuacao++;
            ctx.fillStyle = "#333";
            ctx.font = "16px Arial";
            ctx.fillText("Pontos: " + Math.floor(pontuacao / 10), 10, 25);
        }

        // Inicia o jogo
        loopMotor();
    </script>
</body>
</html>
