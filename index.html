<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Fotos</title>
    <style>
        /* Estilos base da página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        /* Estilo do botão do Google Drive */
        .btn-drive {
            display: inline-block;
            margin-bottom: 40px;
            padding: 12px 24px;
            background-color: #1a73e8;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-drive:hover {
            background-color: #1557b0;
            transform: translateY(-2px);
        }

        /* Estrutura da Galeria usando CSS Grid */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Estilo das imagens */
        .galeria img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .galeria img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <h1>Minhas Fotos</h1>
    
    <a href="https://drive.google.com/drive/folders/10zjYrbhCQBbkWDypN-j8z3lx7IBS3WaJ?usp=sharing" target="_blank" class="btn-drive">
        Ver Pasta Completa no Google Drive
    </a>

    <div class="galeria">
        <img src="https://drive.google.com/uc?export=view&id=16KtWiQ843ZNZs3Y_ydDQvqgr1Xoiz1Im" alt="Foto 1">
        <img src="https://drive.google.com/uc?export=view&id=1LJMgem4Yx-JCu4DOT9Mf45KTtiJBedO_" alt="Foto 2">
        <img src="https://drive.google.com/uc?export=view&id=1QLR9ckuPUieysKcGgrp9js-M04P1nB-E" alt="Foto 3">
        <img src="https://drive.google.com/uc?export=view&id=12XvemVLo5HaEaHVqCwrdwSRK7mOa4paZ" alt="Foto 4">
    </div>

</body>
</html>
