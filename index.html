<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Simulator - Pixel Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive; /* Fonte retro */
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #222;
            padding: 30px;
            border-radius: 5px;
            border: 4px solid #fff; /* Borda estilo retro */
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 900px; /* Tela bem maior */
            text-align: center;
            box-sizing: border-box;
        }
        canvas {
            background-color: #ddd;
            display: block;
            margin: 0 auto;
            width: 100%;
            height: auto;
            image-rendering: pixelated; /* Deixa os gráficos nítidos e quadrados */
            border-radius: 5px;
            border: 4px solid #444;
        }
        input[type="text"] {
            font-family: 'Press Start 2P', cursive;
            padding: 15px;
            font-size: 14px;
            border: 4px solid #fff;
            background-color: #000;
            color: #fff;
            width: 80%;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
        }
        button {
            font-family: 'Press Start 2P', cursive;
            padding: 15px 20px;
            background-color: #ff9800;
            color: white;
            border: 4px solid #fff;
            font-size: 14px;
            cursor: pointer;
            margin: 10px;
            text-transform: uppercase;
        }
        button:hover { background-color: #e68a00; transform: scale(1.05); }
        button:disabled { background-color: #555; border-color: #333; cursor: not-allowed; }
        .oculto { display: none !important; }
        
        .ranking-lista { text-align: left; background: #000; padding: 20px; border: 4px solid #fff; margin-top: 20px; font-size: 12px; line-height: 2; }
        .ranking-item { display: flex; justify-content: space-between; border-bottom: 2px dashed #444; padding: 10px 0; }
        
        h1 { font-size: 24px; text-shadow: 2px 2px #ff9800; margin-bottom: 30px;}
        h2 { font-size: 18px; margin: 20px 0;}
    </style>
</head>
<body>

    <div class="container" id="tela-login">
        <h1>DINO SIMULATOR</h1>
        <p style="font-size: 10px; line-height: 1.5; margin-bottom: 30px;">INSIRA SEU NICKNAME PARA INICIAR</p>
        <input type="text" id="nick" placeholder="PLAYER 1" maxlength="10">
        <br>
        <button id="btn-iniciar">INICIAR JOGO</button>
        <button id="btn-ver-ranking" style="background-color: #2196F3;">RANKING</button>
    </div>

    <div class="container oculto" id="tela-jogo">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px;">
            <span id="display-nick" style="color: #ff9800;"></span>
            <span id="display-pontos">HI: 00000</span>
        </div>
        
        <canvas id="gameCanvas" width="800" height="250"></canvas>
        
        <p style="font-size: 10px; color: #aaa; margin-top: 20px;">ESPAÇO ou TOQUE para pular</p>
    </div>

    <div class="container oculto" id="tela-gameover">
        <h1 style="color: #f44336; text-shadow: 2px 2px #fff;">GAME OVER</h1>
        <h2>SCORE: <span id="pontuacao-final">0</span></h2>
        <button id="btn-salvar-score">SALVAR SCORE</button>
        <button id="btn-jogar-novamente" style="background-color: #4CAF50;">TENTAR NOVAMENTE</button>
    </div>

    <div class="container oculto" id="tela-ranking">
        <h1>TOP 10 PLAYERS</h1>
        <div id="carregando-ranking" style="font-size: 12px;">CARREGANDO DADOS...</div>
        <div class="ranking-lista" id="lista-ranking"></div>
        <button id="btn-voltar-ranking" style="margin-top: 30px;">VOLTAR</button>
    </div>

    <script>
        // ==========================================
        // COLE O SEU LINK DO APPS SCRIPT AQUI ABAIXO
        // ==========================================
        const scriptURL = 'https://script.google.com/macros/s/AKfycbznnZdsQqZyKWOgCIgjYuaPQ8IeuJsMRX6bfark7LVmtkQ9HkxOnHTotQtD4frA059uew/exec';
        
        // Elementos da Tela
        const telaLogin = document.getElementById('tela-login');
        const telaJogo = document.getElementById('tela-jogo');
        const telaGameOver = document.getElementById('tela-gameover');
        const telaRanking = document.getElementById('tela-ranking');
        
        let nickAtual = "";
        let pontuacaoAtual = 0;
        let framesJogo = 0;
        let jogoRodando = false;
        let frameProximoObstaculo = 0; // NOVA VARIÁVEL: Controla o agendamento seguro

        // Configurações do Jogo (Canvas)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let dino = { x: 50, y: 190, largura: 34, altura: 40, dy: 0, pulando: false };
        let cactos = [];
        let nuvens = [];
        const gravidade = 0.8;
        const forcaPulo = -13;
        const chaoY = 230;
        
        let velocidadeAtual = 4; 
        let animacaoFrame;

        // Motor de Áudio
        let audioCtx;
        function iniciarAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function tocarSom(tipo) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const agora = audioCtx.currentTime;

            if (tipo === 'pulo') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, agora);
                osc.frequency.exponentialRampToValueAtTime(600, agora + 0.1);
                gain.gain.setValueAtTime(0.1, agora);
                gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.1);
                osc.start(agora);
                osc.stop(agora + 0.1);
            } else if (tipo === 'ponto') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, agora);
                osc.frequency.setValueAtTime(1200, agora + 0.05);
                gain.gain.setValueAtTime(0.1, agora);
                gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.1);
                osc.start(agora);
                osc.stop(agora + 0.1);
            } else if (tipo === 'morte') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, agora);
                osc.frequency.exponentialRampToValueAtTime(50, agora + 0.3);
                gain.gain.setValueAtTime(0.1, agora);
                gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.3);
                osc.start(agora);
                osc.stop(agora + 0.3);
            }
        }

        function desenharDino() {
            ctx.fillStyle = "#333";
            ctx.fillRect(dino.x + 14, dino.y, 16, 16); 
            ctx.fillRect(dino.x + 6, dino.y + 16, 20, 16); 
            ctx.fillRect(dino.x, dino.y + 16, 6, 8); 
            ctx.fillRect(dino.x + 26, dino.y + 18, 8, 4); 
            ctx.clearRect(dino.x + 18, dino.y + 4, 4, 4);

            if (!dino.pulando) {
                if (Math.floor(framesJogo / 8) % 2 === 0) {
                    ctx.fillRect(dino.x + 10, dino.y + 32, 6, 8); 
                    ctx.fillRect(dino.x + 20, dino.y + 26, 6, 8); 
                } else {
                    ctx.fillRect(dino.x + 10, dino.y + 26, 6, 8); 
                    ctx.fillRect(dino.x + 20, dino.y + 32, 6, 8); 
                }
            } else {
                ctx.fillRect(dino.x + 10, dino.y + 32, 6, 8);
                ctx.fillRect(dino.x + 20, dino.y + 32, 6, 8);
            }
        }

        function desenharCacto(x, y) {
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(x + 10, y, 10, 40); 
            ctx.fillRect(x, y + 10, 8, 16); 
            ctx.fillRect(x + 22, y + 5, 8, 16); 
            ctx.fillRect(x + 2, y + 26, 8, 4); 
            ctx.fillRect(x + 20, y + 21, 8, 4); 
        }

        function mostrarTela(tela) {
            telaLogin.classList.add('oculto');
            telaJogo.classList.add('oculto');
            telaGameOver.classList.add('oculto');
            telaRanking.classList.add('oculto');
            tela.classList.remove('oculto');
        }

        function pular() {
            if (!dino.pulando && jogoRodando) {
                dino.dy = forcaPulo;
                dino.pulando = true;
                tocarSom('pulo');
            }
        }
        
        document.addEventListener('keydown', (e) => { if (e.code === 'Space') pular(); });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); pular(); });

        function atualizarJogo() {
            if (!jogoRodando) return;
            framesJogo++;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Chão e Nuvens
            ctx.fillStyle = "#aaa";
            ctx.fillRect(0, chaoY, canvas.width, 4); 

            if (framesJogo % 120 === 0) {
                nuvens.push({ x: canvas.width, y: Math.random() * 100 + 20 });
            }
            ctx.fillStyle = "#fff";
            nuvens = nuvens.filter(n => {
                n.x -= velocidadeAtual * 0.3; 
                ctx.fillRect(n.x, n.y, 40, 10);
                ctx.fillRect(n.x + 10, n.y - 10, 20, 10);
                return n.x > -50;
            });

            // Física do Dino
            dino.dy += gravidade;
            dino.y += dino.dy;
            
            if (dino.y >= chaoY - dino.altura) {
                dino.y = chaoY - dino.altura;
                dino.pulando = false;
            }

            desenharDino();

            // ==================================================
            // NOVA LÓGICA DE GERAÇÃO SEGURA DE CACTOS
            // ==================================================
            if (framesJogo >= frameProximoObstaculo) {
                // Sorteia se vai vir 1 cacto sozinho ou 2 cactos juntos (mais largo)
                let qtdCactos = Math.random() > 0.75 ? 2 : 1; 
                
                for (let i = 0; i < qtdCactos; i++) {
                    cactos.push({ 
                        x: canvas.width + (i * 25), // Se for mais de 1, gruda eles
                        y: chaoY - 40, 
                        largura: 30, 
                        altura: 40 
                    });
                }

                // Agenda o próximo grupo de cactos com um intervalo seguro
                // Mínimo de 60 frames (tempo suficiente para pular e pousar) + um tempo aleatório
                let gapMinimo = 60 + (velocidadeAtual * 2); 
                let gapAleatorio = Math.random() * 70;
                frameProximoObstaculo = framesJogo + gapMinimo + gapAleatorio;
            }

            // Move e desenha Cactos
            for (let i = 0; i < cactos.length; i++) {
                let c = cactos[i];
                c.x -= velocidadeAtual;
                desenharCacto(c.x, c.y);

                if (dino.x + 10 < c.x + c.largura && dino.x + dino.largura - 10 > c.x && 
                    dino.y + 10 < c.y + c.altura && dino.altura + dino.y > c.y) {
                    gameOver();
                }
            }

            cactos = cactos.filter(c => c.x > -40);

            // Pontuação e Velocidade
            if (framesJogo % 5 === 0) {
                pontuacaoAtual++;
                let displayPts = pontuacaoAtual.toString().padStart(5, '0');
                document.getElementById('display-pontos').innerText = "HI: " + displayPts;

                if (pontuacaoAtual > 0 && pontuacaoAtual % 100 === 0) {
                    tocarSom('ponto');
                    velocidadeAtual += 0.4; // Acelera um pouquinho a cada 100 pts
                }
            }

            animacaoFrame = requestAnimationFrame(atualizarJogo);
        }

        function iniciarJogo() {
            iniciarAudio(); 
            dino.y = chaoY - dino.altura;
            dino.dy = 0;
            cactos = [];
            nuvens = [];
            pontuacaoAtual = 0;
            framesJogo = 0;
            frameProximoObstaculo = 50; // O primeiro cacto aparece rápido
            velocidadeAtual = 4.5; 
            document.getElementById('display-pontos').innerText = "HI: 00000";
            jogoRodando = true;
            mostrarTela(telaJogo);
            atualizarJogo();
        }

        function gameOver() {
            jogoRodando = false;
            tocarSom('morte');
            cancelAnimationFrame(animacaoFrame);
            document.getElementById('pontuacao-final').innerText = pontuacaoAtual;
            mostrarTela(telaGameOver);
            document.getElementById('btn-salvar-score').disabled = false;
            document.getElementById('btn-salvar-score').innerText = "SALVAR SCORE";
        }

        // Eventos dos Botões
        document.getElementById('btn-iniciar').addEventListener('click', () => {
            let n = document.getElementById('nick').value.trim();
            if (n === "") { alert("DIGITE UM NICK!"); return; }
            nickAtual = n;
            document.getElementById('display-nick').innerText = nickAtual;
            iniciarJogo();
        });

        document.getElementById('btn-jogar-novamente').addEventListener('click', iniciarJogo);

        document.getElementById('btn-salvar-score').addEventListener('click', () => {
            const btn = document.getElementById('btn-salvar-score');
            btn.innerText = 'SALVANDO...';
            btn.disabled = true;

            const dados = new URLSearchParams();
            dados.append('Nick', nickAtual);
            dados.append('Pontos', pontuacaoAtual);

            fetch(scriptURL, { method: 'POST', body: dados, mode: 'no-cors' })
                .then(() => {
                    abrirRanking();
                })
                .catch(error => {
                    alert('ERRO AO SALVAR O SCORE.');
                    btn.innerText = 'TENTAR NOVAMENTE';
                    btn.disabled = false;
                });
        });

        document.getElementById('btn-ver-ranking').addEventListener('click', abrirRanking);
        document.getElementById('btn-voltar-ranking').addEventListener('click', () => mostrarTela(telaLogin));

        function abrirRanking() {
            mostrarTela(telaRanking);
            const lista = document.getElementById('lista-ranking');
            const status = document.getElementById('carregando-ranking');
            lista.innerHTML = "";
            status.style.display = "block";

            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    status.style.display = "none";
                    if (data.length === 0) {
                        lista.innerHTML = "<p style='text-align:center;'>NENHUM REGISTRO AINDA.</p>";
                        return;
                    }
                    data.forEach((jogador, index) => {
                        let medalha = index === 0 ? "1ST" : index === 1 ? "2ND" : index === 2 ? "3RD" : (index + 1) + "TH";
                        lista.innerHTML += `
                            <div class="ranking-item">
                                <span style="color:#ff9800;">${medalha}</span>
                                <span>${jogador.nick}</span>
                                <span>${jogador.pontos}</span>
                            </div>
                        `;
                    });
                }).catch(err => {
                    status.innerText = "ERRO AO CONECTAR COM O SERVIDOR.";
                });
        }
    </script>
</body>
</html>
